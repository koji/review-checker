name: Find My Review Requests

on:
  workflow_dispatch: # Actionsタブから手動で実行できるようにする
  # schedule:
  #   - cron: '0 1 * * *' # 毎日 AM 1:00 (UTC) に定期実行する場合

jobs:
  find-requests:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read

    steps:
      - name: Get PR list
        id: get_prs # ★ 後続ステップから参照するためのID
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TARGET_REPO: 'Opentrons/opentrons' # ★検索対象のリポジトリ
          MY_USERNAME: 'koji' # ★あなたのGitHubユーザー名
        run: |
          echo "Searching for PRs in ${{ env.TARGET_REPO }} requesting review from ${{ env.MY_USERNAME }}..."

          # gh search prsでリストを取得し、Slackのmrkdwn形式に整形
          PR_LIST=$(gh search prs --repo ${{ env.TARGET_REPO }} --state=open --review-requested=${{ env.MY_USERNAME }} \
            --json number,title,url \
            --jq '.[] | "- <\(.url)|#\(.number): \(.title)>"') # ★ Slackのリンク形式 <URL|Text>
            
          # 結果をチェック
          if [ -z "$PR_LIST" ]; then
            echo "No matching PRs found."
            # ★ 0件だった場合のメッセージをStep Outputに設定
            echo "pr_body=✅ No review requests found for @${{ env.MY_USERNAME }} in ${{ env.TARGET_REPO }}." >> $GITHUB_OUTPUT
            echo "has_prs=false" >> $GITHUB_OUTPUT
          else
            echo "Found PRs:"
            echo "$PR_LIST"
            
            # ★ Slackに送る本文をStep Outputに設定 (複数行)
            {
              echo "pr_body<<EOF"
              echo "🔔 **Review Requests for @${{ env.MY_USERNAME }} in ${{ env.TARGET_REPO }}**"
              echo ""
              echo "$PR_LIST"
              echo "EOF"
            } >> $GITHUB_OUTPUT
            echo "has_prs=true" >> $GITHUB_OUTPUT
          fi

      # --- ↓ ここから下を追加 ↓ ---
      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1
        with:
          # Step "get_prs" の "pr_body" output をペイロードとして使用
          payload: |
            {
              "text": "${{ steps.get_prs.outputs.pr_body }}"
            }
        env:
          # ★ Step 2 で設定した Secret を参照
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
